data_ingestion:
  bucket_name : "my_bucket_21"
  bucket_file_name : "Hotel_Reservations.csv"
  train_ratio : 0.8
  folder_name: "Trained_Model/"

data_preprocessing:

  
  categorical:
    - type_of_meal_plan
    - room_type_reserved
    - market_segment_type
    
  numerical:
    - no_of_adults
    - no_of_children
    - no_of_weekend_nights
    - no_of_week_nights
    - required_car_parking_space
    - lead_time
    - arrival_date
    - repeated_guest
    - no_of_previous_cancellations
    - no_of_previous_bookings_not_canceled
    - avg_price_per_room
    - no_of_special_requests
   
  target_column : booking_status

  skewness_threshold: 5
  number_of_feature: 10

    
